name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SMOKE_BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      LLM_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Start production server
        run: |
          pnpm start:ci > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 45); do
            if curl -sf "${SMOKE_BASE_URL}/api/health" | node -e "
              const chunks = [];
              process.stdin.on('data', (c) => chunks.push(c));
              process.stdin.on('end', () => {
                try {
                  const data = JSON.parse(Buffer.concat(chunks).toString());
                  if (data.ok) process.exit(0);
                  console.error('health not ready:', JSON.stringify(data));
                  process.exit(1);
                } catch (e) {
                  console.error(e);
                  process.exit(1);
                }
              });
            "; then
              echo "Server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "--- next.log ---"
          cat /tmp/next.log
          exit 1

      - name: API smoke
        run: pnpm smoke

      - name: Playwright E2E
        run: pnpm test:e2e

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/next.pid)" 2>/dev/null || true
